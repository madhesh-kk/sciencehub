# Spring Boot Production Configuration
# Active with: --spring.profiles.active=prod

# Server Configuration
server.port=8085
server.servlet.context-path=/api
server.compression.enabled=true
server.compression.min-response-size=1024

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/sciencehubdb
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# CORS Configuration
cors.allowed.origins=https://sciencehub.com,https://www.sciencehub.com
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed.headers=*
cors.allow.credentials=true

# Security
spring.security.require-https=true
security.jwt.secret=${JWT_SECRET:your-secret-key-change-in-production}
security.jwt.expiration=86400000

# Logging
logging.level.root=WARN
logging.level.com.example.springbackend=INFO
logging.file.name=/var/log/sciencehub/spring-backend.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator (Health Checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Performance
spring.threads.virtual.enabled=true
spring.application.name=sciencehub-backend
