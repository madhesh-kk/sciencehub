# Spring Boot Production Configuration
# Active with: --spring.profiles.active=prod
# Uses H2 In-Memory Database for Render deployment

# Server Configuration
server.port=8080
server.servlet.context-path=
server.compression.enabled=true
server.compression.min-response-size=1024

# H2 Database Configuration (In-Memory)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# CORS Configuration
cors.allowed.origins=https://sciencehub-three.vercel.app
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed.headers=*
cors.allow.credentials=true

# Security
spring.security.require-https=false
security.jwt.secret=${JWT_SECRET:your-secret-key-change-in-production}
security.jwt.expiration=86400000

# Logging
logging.level.root=WARN
logging.level.com.example.springbackend=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator (Health Checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Application Name
spring.application.name=sciencehub-backend

