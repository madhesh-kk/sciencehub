# Spring Boot Production Configuration
# Uses MySQL Database

# Server Configuration
server.port=8080
server.servlet.context-path=
server.compression.enabled=true
server.compression.min-response-size=1024

# MySQL Database Configuration (for production on Render)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:sciencehub}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:madhesh@24680}
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# CORS Configuration
cors.allowed.origins=https://sciencehub-three.vercel.app
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed.headers=*
cors.allow.credentials=true

# Security
spring.security.require-https=false
security.jwt.secret=${JWT_SECRET:your-secret-key-change-in-production}
security.jwt.expiration=86400000

# Logging
logging.level.root=WARN
logging.level.com.example.springbackend=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator (Health Checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Application Name
spring.application.name=sciencehub-backend
