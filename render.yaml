services:
  - type: web
    name: sciencehub-api
    env: java
    plan: free
    buildCommand: cd backend && mvn clean package -DskipTests
    startCommand: java -jar backend/target/spring-backend-0.0.1-SNAPSHOT.jar
    healthCheckPath: /api/actuator/health
    healthCheckStartupTimeout: 300
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: create-drop
      - key: SPRING_JPA_DATABASE_PLATFORM
        value: org.hibernate.dialect.H2Dialect
      - key: SPRING_DATASOURCE_URL
        value: jdbc:h2:file:/tmp/sciencehub
      - key: SPRING_DATASOURCE_DRIVERCLASSNAME
        value: org.h2.Driver
      - key: SPRING_H2_CONSOLE_ENABLED
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: https://sciencehub-three.vercel.app,http://localhost:5173,http://localhost:3000
      - key: RAZORPAY_KEY_ID
        value: ${RAZORPAY_KEY_ID}
      - key: RAZORPAY_SECRET_KEY
        value: ${RAZORPAY_SECRET_KEY}


